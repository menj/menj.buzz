<!DOCTYPE html>
<html lang="{{site.lang}}" data-theme="night">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="description" content="{{notFound.metaDescription}}" />
<title>{{notFound.pageTitle}} — {{site.siteName}}</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/css/tailwind.css">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="font-sans antialiased">
  <main class="mx-auto max-w-6xl px-5 sm:px-8 py-32">
    <p class="font-mono text-[11px] uppercase tracking-[0.28em] text-accent mb-4">{{notFound.eyebrow}}</p>
    <h1 class="font-display text-4xl sm:text-6xl font-light tracking-[-0.02em]">
      {{notFound.heading}}
    </h1>
    <p class="mt-6 max-w-lg prose-body">
      {{notFound.body}}
    </p>
    <p class="mt-8 flex flex-wrap gap-3">
      <a href="/" class="inline-flex items-center gap-2 px-5 py-3 rounded-full text-sm font-medium text-ink"
         style="background:var(--c-accent)">{{notFound.primaryLabel}}</a>
      <a href="/sitemap.html" class="inline-flex items-center gap-2 px-5 py-3 rounded-full text-sm border border-line text-cream hover:border-accent hover:text-accent transition-colors">{{notFound.secondaryLabel}}</a>
    </p>
  </main>
</body>
</html>
